[build-system]
requires = ["setuptools>=42", "wheel", "torch>=2.1.0"]  # Make sure torch matches your CUDA
build-backend = "setuptools.build_meta"

[project]
name = "mjlab-piplus"
version = "0.1.0"
license = "Apache-2.0"
description = "PiPlus mjlab project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kornia>=0.8.2",
    "mjlab",
    "onnxruntime",
    "tqdm>=4.67.3",
    "transforms3d>=0.4.2",
]

[project.entry-points."mjlab.tasks"]
mjlab_piplus = "mjlab_piplus.tasks"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "a23ba4b65c384806085197ac1a952480992c3359" }
