[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-piplus"
version = "0.1.0"
license = "Apache-2.0"
description = "PiPlus mjlab project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mjlab",
    "onnxruntime",
]

[project.entry-points."mjlab.tasks"]
mjlab_piplus = "mjlab_piplus.tasks"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "efdcadc8b281553fd3e1be2a9a88db9553356e8a" }
